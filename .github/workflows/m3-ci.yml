name: M3 Cross-Platform CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            expected_arch: x86_64

          - name: windows-x64
            os: windows-2025
            expected_arch: AMD64

          - name: macos-arm64
            os: macos-14
            expected_arch: arm64

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser/package-lock.json

      - name: Verify runner identity
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          python -c "import os, platform, sys; actual=platform.machine(); expected=os.environ['EXPECTED_ARCH']; normalized={'AMD64':'AMD64','x86_64':'x86_64','arm64':'arm64','aarch64':'arm64'}.get(actual, actual); print('OS:', platform.system()); print('Release:', platform.release()); print('Machine:', actual); print('Normalized architecture:', normalized); print('Python:', sys.version); print('Expected architecture:', expected); assert normalized == expected, f'Architecture mismatch: expected {expected}, got {normalized}'"

      - name: Compile Python sources
        run: python -m compileall -q src benchmark tests

      - name: Verify browser model artifact
        run: |
          python -c "from pathlib import Path; p=Path('browser/public/models/yolo26n_webgpu.onnx'); assert p.is_file(), f'Missing model: {p}'; size=p.stat().st_size; assert size == 9894054, f'Unexpected model size: {size}'; print(f'Browser model OK: {p} ({size} bytes)')"

      - name: Install ONNX Runtime smoke-test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.4.6" "onnxruntime==1.30.0"

      - name: Smoke-test browser ONNX artifact
        run: |
          python -c "import numpy as np, onnxruntime as ort; model='browser/public/models/yolo26n_webgpu.onnx'; session=ort.InferenceSession(model, providers=['CPUExecutionProvider']); inp=session.get_inputs()[0]; out=session.run(None, {inp.name: np.zeros((1,3,640,640), dtype=np.float32)}); y=out[0]; assert tuple(y.shape) == (1,300,6), f'Unexpected output shape: {y.shape}'; assert np.isfinite(y).all(), 'Non-finite output detected'; print('ORT CPU smoke test passed'); print('Input:', inp.name, inp.shape, inp.type); print('Output:', y.shape, y.dtype)"

      - name: Install browser dependencies
        working-directory: browser
        run: npm ci

      - name: Build browser
        working-directory: browser
        run: npm run build
